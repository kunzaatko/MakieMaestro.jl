name: CI
on:
  push:
    branches:
      - trunk
    tags: ['*']
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'min'
          - 'lts'
          - 'pre'
          # - '~1.12.0-0'
          # - 'pre' # NOTE: Broken WGLMakie <09-04-25> 
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
        with:
          prefix: xvfb-run -s '-screen 0 1024x768x24'
      - uses: julia-actions/julia-processcoverage@v1
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      # NOTE: The `@makie` figure cache store is content-addressed and append-only: restored entries are looked up by
      # digest, so unchanged figure definitions are not re-rendered, while new or changed ones render and are added to
      # the store, which is saved back after the job. The key includes `${{ github.run_id }}` so that every run saves
      # the grown store (an exact key hit would skip the save-back and new figures would be re-rendered on every
      # run). NOTE: The digest deliberately does not cover package versions (documented stale risk), so bump the
      # `v1` segment to force a full re-render after rendering-semantics changes, or delete the caches with
      # `gh cache delete --all`. <23-11-26> 
      - name: Cache generated figures
        uses: actions/cache@v4
        with:
          path: docs/cached/figures
          key: docs-figures-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            docs-figures-v1-${{ runner.os }}-
      - name: Setup docs julia project
        run: >
            DISPLAY=:0 xvfb-run -s '-screen 0 1024x768x24' -- julia --project=docs --color=yes --eval "using Pkg; Pkg.develop(PackageSpec(path=abspath(\".\"))); Pkg.instantiate()"; # NOTE: compilation of Makie also needs a screen 
      - uses: julia-actions/julia-buildpkg@latest
      - name: Build and deploy docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
            cd docs;
            DISPLAY=:0 xvfb-run -s '-screen 0 1024x768x24' -- julia --project --color=yes make.jl # NOTE: showing figures needs a screen
